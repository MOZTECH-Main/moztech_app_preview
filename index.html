<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/moztech_app_preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MOZTECH 智慧產品生命週期與品牌服務 App。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MOZTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MOZTECH</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #42C8F4 0%, #2BB9ED 55%, #11A7DC 100%);
    }

    #moz-preloader {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      pointer-events: none;
      color: rgba(255, 255, 255, 0.88);
      font-family: Poppins, "Noto Sans TC", sans-serif;
      letter-spacing: 0;
    }

    #moz-preloader img {
      width: min(64vw, 286px);
      max-height: 132px;
      opacity: 0.96;
    }

    #moz-preloader span {
      max-width: 280px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      text-align: center;
      opacity: 0.88;
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <script>
    // GitHub Pages preview is served as a static demo. Remove old Flutter PWA
    // workers so preview visitors do not stay on a stale build.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => registrations.forEach((worker) => worker.unregister()));
    }
  </script>
</head>
<body>
  <div id="moz-preloader" aria-label="MOZTECH 載入中">
    <img src="assets/logos/moztech_logo_white.svg" alt="MOZTECH">
    <span>Moz innovation, more comfortable life.</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('moz-preloader')?.remove();
    });
    window.setTimeout(function () {
      document.getElementById('moz-preloader')?.remove();
    }, 6000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
