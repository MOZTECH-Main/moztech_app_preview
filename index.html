<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/moztech_app_preview/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MOZTECH 智慧產品生命週期與品牌服務 App。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MOZTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MOZTECH</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --moz-blue: #2BB9ED;
      --moz-blue-deep: #159FCC;
      --moz-blue-soft: rgba(43, 185, 237, 0.12);
      --moz-ink: #111827;
      --moz-muted: #667085;
      --moz-white: #FFFFFF;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #FFFFFF 0%, #F8FCFE 66%, #EEF9FD 100%);
    }

    #moz-preloader {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      pointer-events: none;
      color: var(--moz-muted);
      font-family: Poppins, "Noto Sans TC", sans-serif;
      letter-spacing: 0;
      background:
        radial-gradient(circle at 50% 43%, rgba(43, 185, 237, 0.13) 0, rgba(43, 185, 237, 0.05) 22%, rgba(43, 185, 237, 0) 46%),
        radial-gradient(circle at 16% 14%, rgba(43, 185, 237, 0.07) 0, rgba(43, 185, 237, 0) 30%),
        linear-gradient(180deg, #FFFFFF 0%, #F9FCFE 68%, #EFF9FD 100%);
      opacity: 1;
      transition: opacity 360ms ease;
    }

    #moz-preloader.is-leaving {
      opacity: 0;
    }

    .moz-preloader-lockup {
      position: relative;
      display: flex;
      min-height: 240px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transform: translateY(2vh);
      animation: mozLockupFloat 4800ms ease-in-out 1100ms infinite;
    }

    .moz-preloader-mark {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: min(50vw, 220px);
      min-height: 190px;
      overflow: hidden;
      border-radius: 44px;
    }

    .moz-preloader-mark::before,
    .moz-preloader-mark::after {
      position: absolute;
      content: "";
      pointer-events: none;
    }

    .moz-preloader-mark::before {
      inset: 10px 8px;
      border: 1px solid rgba(255, 255, 255, 0.86);
      border-radius: 40px;
      background:
        radial-gradient(circle at 34% 22%, rgba(255, 255, 255, 0.96) 0, rgba(255, 255, 255, 0.58) 36%, rgba(255, 255, 255, 0.20) 72%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.74), rgba(239, 249, 253, 0.54));
      box-shadow:
        0 24px 58px rgba(16, 115, 151, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.96);
      opacity: 0;
      transform: scale(0.94);
      animation: mozLogoField 1800ms cubic-bezier(.2, .75, .18, 1) 220ms forwards;
    }

    .moz-preloader-mark::after {
      top: 58px;
      left: 50%;
      width: 78px;
      height: 78px;
      border-radius: 999px;
      border: 2px solid rgba(43, 185, 237, 0.22);
      border-right-color: rgba(43, 185, 237, 0.03);
      border-bottom-color: rgba(43, 185, 237, 0.07);
      opacity: 0;
      transform: translate(-50%, -50%) rotate(-24deg) scale(0.92);
      animation: mozMarkOrbit 3000ms cubic-bezier(.4, 0, .2, 1) 520ms infinite;
    }

    #moz-preloader img {
      position: relative;
      z-index: 2;
      width: min(45vw, 196px);
      max-height: 196px;
      opacity: 0;
      filter: drop-shadow(0 16px 28px rgba(21, 159, 204, 0.12));
      animation:
        mozLogoEnter 980ms cubic-bezier(.16, 1, .3, 1) 120ms forwards,
        mozLogoBreath 3600ms ease-in-out 1300ms infinite;
    }

    #moz-preloader-wordmark {
      display: none;
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      color: var(--moz-blue);
    }

    #moz-preloader-wordmark.is-visible {
      display: block;
      opacity: 0;
      animation: mozLogoEnter 980ms cubic-bezier(.16, 1, .3, 1) 120ms forwards;
    }

    .moz-preloader-shine {
      position: absolute;
      z-index: 3;
      top: 38px;
      bottom: 38px;
      left: -34%;
      width: 26%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(43, 185, 237, 0.14), transparent);
      filter: blur(1px);
      opacity: 0;
      transform: skewX(-18deg);
      animation: mozLogoShine 2600ms cubic-bezier(.45, 0, .2, 1) 980ms infinite;
    }

    .moz-preloader-slogan {
      max-width: 280px;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--moz-muted);
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      animation: mozSloganEnter 880ms cubic-bezier(.16, 1, .3, 1) 420ms forwards;
    }

    .moz-preloader-progress {
      position: relative;
      width: 132px;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(43, 185, 237, 0.14);
      opacity: 0;
      transform: translateY(6px);
      animation: mozProgressEnter 780ms ease-out 680ms forwards;
    }

    .moz-preloader-progress::after {
      position: absolute;
      inset: 0;
      content: "";
      width: 48%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--moz-blue), var(--moz-blue-deep));
      transform: translateX(-110%);
      animation: mozProgressSweep 1700ms cubic-bezier(.45, 0, .2, 1) 880ms infinite;
    }

    @keyframes mozLogoEnter {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.94);
      }
      70% {
        opacity: 1;
        transform: translateY(-2px) scale(1.01);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes mozLogoBreath {
      0%, 100% {
        transform: translateY(0) scale(1);
        filter: drop-shadow(0 16px 28px rgba(21, 159, 204, 0.12));
      }
      50% {
        transform: translateY(-3px) scale(1.012);
        filter: drop-shadow(0 22px 36px rgba(21, 159, 204, 0.17));
      }
    }

    @keyframes mozSloganEnter {
      0% {
        opacity: 0;
        transform: translateY(12px);
      }
      100% {
        opacity: 0.92;
        transform: translateY(0);
      }
    }

    @keyframes mozLogoField {
      0% {
        opacity: 0;
        transform: scale(0.94);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes mozMarkOrbit {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(-40deg) scale(0.88);
      }
      18% {
        opacity: 0.68;
      }
      60% {
        opacity: 0.36;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(160deg) scale(1.02);
      }
    }

    @keyframes mozLogoShine {
      0% {
        opacity: 0;
        left: -34%;
      }
      18% {
        opacity: 0.55;
      }
      52% {
        opacity: 0.18;
      }
      78%, 100% {
        opacity: 0;
        left: 106%;
      }
    }

    @keyframes mozProgressEnter {
      0% {
        opacity: 0;
        transform: translateY(6px) scaleX(0.72);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scaleX(1);
      }
    }

    @keyframes mozProgressSweep {
      0% {
        transform: translateX(-110%);
      }
      72%, 100% {
        transform: translateX(245%);
      }
    }

    @keyframes mozLockupFloat {
      0%, 100% {
        transform: translateY(2vh);
      }
      50% {
        transform: translateY(calc(2vh - 5px));
      }
    }

    @media (max-width: 420px) {
      .moz-preloader-mark {
        width: min(58vw, 212px);
        min-height: 182px;
      }

      #moz-preloader img {
        width: min(52vw, 188px);
      }

      .moz-preloader-mark::after {
        top: 56px;
        width: 74px;
        height: 74px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #moz-preloader img,
      #moz-preloader-wordmark.is-visible,
      .moz-preloader-lockup,
      .moz-preloader-mark::before,
      .moz-preloader-mark::after,
      .moz-preloader-shine,
      .moz-preloader-slogan,
      .moz-preloader-progress,
      .moz-preloader-progress::after {
        animation: none;
      }

      #moz-preloader img,
      #moz-preloader-wordmark.is-visible,
      .moz-preloader-slogan,
      .moz-preloader-progress {
        opacity: 1;
        transform: none;
      }
    }
  </style>
  <script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>
  <script>
    // GitHub Pages preview is served as a static demo. Remove old Flutter PWA
    // workers so preview visitors do not stay on a stale build.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then((registrations) => registrations.forEach((worker) => worker.unregister()));
    }
  </script>
</head>
<body>
  <div id="moz-preloader" role="status" aria-live="polite" aria-label="正在準備 MOZTECH">
    <div class="moz-preloader-lockup">
      <div class="moz-preloader-mark">
        <span class="moz-preloader-shine" aria-hidden="true"></span>
        <img
          src="assets/assets/logos/moztech_vertical.svg"
          alt="MOZTECH"
          onerror="this.style.display = 'none'; document.getElementById('moz-preloader-wordmark')?.classList.add('is-visible');"
        >
        <strong id="moz-preloader-wordmark" aria-hidden="true">MOZTECH</strong>
      </div>
      <span class="moz-preloader-slogan">裝置準備好，重要事情不漏。</span>
      <div class="moz-preloader-progress" aria-hidden="true"></div>
    </div>
  </div>
  <script>
    const mozPreloaderStartedAt = performance.now();
    const mozMinPreloaderMs = 720;
    let mozPreloaderDismissed = false;

    function dismissMozPreloader() {
      if (mozPreloaderDismissed) {
        return;
      }

      mozPreloaderDismissed = true;
      const elapsedMs = performance.now() - mozPreloaderStartedAt;
      const remainingMs = Math.max(0, mozMinPreloaderMs - elapsedMs);

      window.setTimeout(function () {
        const preloader = document.getElementById('moz-preloader');
        if (!preloader) {
          return;
        }

        preloader.classList.add('is-leaving');
        window.setTimeout(function () {
          preloader.remove();
        }, 500);
      }, remainingMs);
    }

    window.addEventListener('flutter-first-frame', function () {
      dismissMozPreloader();
    });
    window.setTimeout(function () {
      dismissMozPreloader();
    }, 6500);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
